# SalaryAxis CI
# Shaz Moghaddam · https://shazmoghaddam.github.io · London
#
# Checks the files currently in the repository. The application source
# (api/, data/, pipeline/, utils/, frontend/, tests/) is being restored;
# add the test suite and Docker build jobs here once it is back.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyyaml

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Lint for errors (ruff)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Load config
        run: python -c "import config; assert config.SALARY_MIN < config.SALARY_MAX; print('config OK')"

      - name: Validate Docker Compose files
        run: |
          python - <<'PY'
          import yaml
          for f in ("docker-compose.yml", "docker-compose.prod.yml"):
              with open(f) as fh:
                  data = yaml.safe_load(fh)
              assert "services" in data, f"{f} has no services"
              print(f"{f} OK")
          PY

      - name: Validate demo CSV
        run: |
          python -c "import pandas as pd; df = pd.read_csv('salaryaxis_demo_org.csv'); assert len(df) > 0; print(f'demo CSV OK: {len(df)} rows')"
